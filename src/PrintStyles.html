<style>

@page {
  size: A5 portrait;
  margin: 10mm;
}

* {
  box-sizing: border-box;
}

.print-body {
  margin: 0;

  font-family: Arial, Helvetica, sans-serif;
  color: #111;
  background: #fff;
}

.print-toolbar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin: 0 auto 15px;
  max-width: 760px;
}

.print-toolbar button {
  padding: 9px 16px;
  border: 0;
  border-radius: 5px;
  background: #222;
  color: #fff;
  cursor: pointer;
  font-weight: 700;
}

.print-paper {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 30px;
  background: #fff;
  border: 1.5px solid #111;
}

.print-header {
  text-align: center;
  padding-bottom: 15px;

}

}

  line-height: 1.5;
}

.print-title {
  margin-top: 14px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
}

.print-meta {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin: 20px 0;
  font-size: 12px;
}

.print-row {
  display: grid;
  grid-template-columns: 180px 1fr;

}

  padding: 10px;

}

.print-value {
  display: flex;

}

.print-signature {

  font-size: 11px;
}

    display: none !important;
