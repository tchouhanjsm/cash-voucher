<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f3;
    color: #20201e;
  }

  body {
    min-height: 100vh;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  .hidden {
    display: none !important;
  }

  /* LOGIN */

  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f5f5f3;
  }

  .login-card {
    width: min(420px, 100%);
    padding: 36px;
    background: #fff;
    border: 1px solid #e3e3de;
    border-radius: 14px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
  }

  .login-brand {
    text-align: center;
    margin-bottom: 30px;
  }

  .login-property {
    font-size: 23px;
    font-weight: 700;
  }

  .login-subtitle {
    margin-top: 7px;
    color: #777;
    font-size: 13px;
  }

  .login-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 16px;
  }

  /* APP */

  .app-shell {
    min-height: 100vh;
    display: flex;
  }

  .sidebar {
    width: 240px;
    min-height: 100vh;
    background: #20201e;
    color: #fff;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
  }

  .sidebar-brand {
    padding: 4px 10px 26px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .sidebar-property {
    font-size: 18px;
    font-weight: 700;
  }

  .sidebar-product {
    margin-top: 5px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
  }

  .sidebar-nav {
    padding-top: 20px;
  }

  .nav-item {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 5px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: rgba(255, 255, 255, 0.78);
    text-align: left;
    cursor: pointer;
  }

  .nav-item:hover,
  .nav-item.active {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .nav-divider {
    height: 1px;
    margin: 15px 8px;
    background: rgba(255, 255, 255, 0.12);
  }

  .sidebar-bottom {
    margin-top: auto;
    padding: 16px 10px 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }

  .sidebar-user {
    margin-bottom: 12px;
  }

  #sidebarUserName {
    font-size: 13px;
    font-weight: 700;
  }

  #sidebarUserRole {
    margin-top: 4px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
  }

  .logout-link {
    border: 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.7);
    padding: 0;
    cursor: pointer;
  }

  .app-content {
    width: calc(100% - 240px);
    margin-left: 240px;
  }

  .app-topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 28px;
    background: rgba(255, 255, 255, 0.96);
    border-bottom: 1px solid #e4e4df;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
  }

  .page-subtitle {
    margin-top: 4px;
    color: #777;
    font-size: 12px;
  }

  .topbar-user {
    text-align: right;
  }

  .user-name {
    font-size: 12px;
    font-weight: 700;
  }

  .role-badge {
    display: inline-block;
    margin-top: 4px;
    padding: 4px 8px;
    border-radius: 20px;
    background: #eeeae0;
    color: #705522;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .page-container {
    max-width: 1250px;
    margin: 0 auto;
    padding: 28px;
  }

  .page-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
  }

  .page-heading h1 {
    margin: 0;
    font-size: 24px;
  }

  .page-heading p {
    margin: 6px 0 0;
    color: #777;
    font-size: 13px;
  }

  /* CARDS */

  .card {
    margin-bottom: 20px;
    padding: 24px;
    background: #fff;
    border: 1px solid #e4e4df;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.025);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .card-header h2 {
    margin: 0;
    font-size: 18px;
  }

  .card-header p {
    margin: 5px 0 0;
    color: #777;
    font-size: 12px;
  }

  /* DASHBOARD */

  .dashboard-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 24px;
  }

  .summary-card {
    padding: 20px;
    background: #fff;
    border: 1px solid #e4e4df;
    border-radius: 12px;
  }

  .summary-label {
    color: #777;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .summary-value {
    margin-top: 9px;
    font-size: 25px;
    font-weight: 700;
  }

  .summary-help {
    margin-top: 7px;
    color: #888;
    font-size: 11px;
  }

  /* FORMS */

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .form-group.full {
    grid-column: 1 / -1;
  }

  label {
    font-size: 12px;
    font-weight: 700;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d1d1cb;
    border-radius: 7px;
    background: #fff;
    color: #20201e;
    font-size: 13px;
  }

  textarea {
    resize: vertical;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #999;
  }

  /* PAYMENT ROWS */

  .bulk-entry-header,
  .payment-entry-row {
    display: grid;
    grid-template-columns: 1fr 180px 42px;
    gap: 12px;
    align-items: center;
  }

  .bulk-entry-header {
    margin-bottom: 8px;
    color: #777;
    font-size: 11px;
    font-weight: 700;
  }

  .payment-entry-row {
    margin-bottom: 10px;
  }

  .remove-row-button {
    width: 38px;
    height: 38px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }

  /* BUTTONS */

  .btn {
    padding: 10px 15px;
    border: 0;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary {
    background: #20201e;
    color: #fff;
  }

  .btn-secondary {
    background: #ecece8;
    color: #222;
  }

  .btn-danger {
    background: #a43b32;
    color: #fff;
  }

  .btn-small {
    padding: 6px 9px;
    font-size: 10px;
  }

  .form-actions,
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  /* REGISTER */

  .register-toolbar {
    display: grid;
    grid-template-columns: 1fr 150px 150px auto auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }

  .register-total {
    font-weight: 700;
    text-align: right;
  }

  .table-wrapper {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  th,
  td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e5df;
    text-align: left;
  }

  th {
    background: #fafaf8;
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
  }

  .amount-cell {
    text-align: right;
    white-space: nowrap;
    font-weight: 700;
  }

  .actions-cell {
    white-space: nowrap;
  }

  .action-button {
    padding: 6px 9px;
    border: 1px solid #d2d2cc;
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 700;
  }

  .status-active {
    background: #edf6f0;
    color: #256b45;
  }

  .status-cancelled {
    background: #fff0ee;
    color: #a43b32;
  }

  .empty-state {
    padding: 30px;
    text-align: center;
    color: #777;
  }

  /* PROFILE */

  .profile-card {
    max-width: 650px;
  }

  .profile-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #e5e5df;
  }

  .profile-row:last-child {
    border-bottom: 0;
  }

  /* USERS */

  .users-list {
    display: flex;
    flex-direction: column;
  }

  .user-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #e5e5df;
  }

  .user-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .user-info span {
    color: #777;
    font-size: 11px;
  }

  .user-role {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* ALERT */

  .alert {
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 7px;
    font-size: 12px;
  }

  .alert-success {
    background: #edf6f0;
    color: #256b45;
  }

  .alert-error {
    background: #fff0ee;
    color: #a43b32;
  }

  /* MODAL */

  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.45);
  }

  .modal-card {
    width: min(650px, 100%);
    padding: 24px;
    background: #fff;
    border-radius: 12px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .modal-header h2 {
    margin: 0;
  }

  .close-button {
    border: 0;
    background: transparent;
    font-size: 25px;
    cursor: pointer;
  }

  /* MOBILE */

  @media (max-width: 850px) {
    .sidebar {
      width: 200px;
    }

    .app-content {
      width: calc(100% - 200px);
      margin-left: 200px;
    }

    .dashboard-summary {
      grid-template-columns: 1fr;
    }

    .register-toolbar {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 650px) {
    .sidebar {
      position: static;
      width: 100%;
      min-height: auto;
    }

    .app-shell {
      display: block;
    }

    .app-content {
      width: 100%;
      margin-left: 0;
    }

    .sidebar-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .sidebar-bottom {
      margin-top: 10px;
    }

    .app-topbar {
      position: static;
    }

    .page-container {
      padding: 16px;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-group.full {
      grid-column: auto;
    }

    .bulk-entry-header,
    .payment-entry-row {
      grid-template-columns: 1fr 110px 42px;
    }

    .register-toolbar {
      grid-template-columns: 1fr;
    }

    .page-heading {
      flex-direction: column;
    }
  }
</style>
