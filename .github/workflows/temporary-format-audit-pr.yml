name: Temporary readiness-format repair

on:
  push:
    branches:
      - audit/final-readiness-reconciliation-2026-10-17

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned project tools
        run: npm ci --ignore-scripts
      - name: Format the flagged files with the repository's pinned Prettier
        run: npx --no-install prettier --write PROJECT.md docs/BACKLOG.md test/test-current-readiness-docs.js
      - name: Commit formatter output
        shell: bash
        run: |
          if ! git diff --quiet -- PROJECT.md docs/BACKLOG.md test/test-current-readiness-docs.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT.md docs/BACKLOG.md test/test-current-readiness-docs.js
            git commit -m "style: format final readiness audit files"
            git push
          else
            echo "No formatting changes were needed."
          fi
