name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-guard:
    name: Verify release provenance and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be reachable from client-main
        run: |
          git fetch --no-tags origin refs/heads/client-main:refs/remotes/origin/client-main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/client-main; then
            echo "Release tags must point to a commit already contained in client-main."
            exit 1
          fi
          echo "Release provenance verified against client-main."

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = 'v' + pkg.version;
          const actual = process.env.RELEASE_TAG;
          if (actual !== expected) {
            console.error('Release tag ' + actual + ' does not match package version ' + expected + '.');
            process.exit(1);
          }
          console.log('Release version verified: ' + pkg.version);
          NODE

  quality:
    name: Reuse CI / Quality
    needs: [release-guard]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  browser:
    name: Reuse Browser E2E
    needs: [release-guard, quality]
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: [release-guard, quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release after all validation gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
