name: One-time B5 formatter repair

on:
  push:
    branches:
      - client/deep-dive-data-integrity-20261024

permissions:
  contents: write

jobs:
  format-b5:
    if: github.ref == 'refs/heads/client/deep-dive-data-integrity-20261024'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v7
        with:
          ref: client/deep-dive-data-integrity-20261024
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install without running package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Format only B5 source and test files
        run: |
          ./node_modules/.bin/prettier --write \
            backend/50-vouchers.gs \
            backend/54-cash-close.gs \
            frontend/features/register.js \
            test/mock-gas.js \
            test/test-backend.js \
            test/test-register-edit-contract.js
      - name: Commit formatted files and remove one-time workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-format-b5.yml
          git add \
            backend/50-vouchers.gs \
            backend/54-cash-close.gs \
            frontend/features/register.js \
            test/mock-gas.js \
            test/test-backend.js \
            test/test-register-edit-contract.js
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "style: format deep-dive data-integrity batch"
          git push origin HEAD:refs/heads/client/deep-dive-data-integrity-20261024
