name: Temporary format client onboarding presentation

on:
  push:
    branches:
      - feature/client-onboarding-presentation-runbook

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/client-onboarding-presentation-runbook
      - name: Setup supported Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Apply repository Prettier rules to the presentation
        run: npx prettier --write docs/CLIENT-ONBOARDING-PRESENTATION.html
      - name: Commit only the formatted HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/CLIENT-ONBOARDING-PRESENTATION.html; then
            echo "Presentation already matches repository formatting."
            exit 0
          fi
          git add docs/CLIENT-ONBOARDING-PRESENTATION.html
          git commit -m "Format client onboarding presentation"
          git push origin HEAD:feature/client-onboarding-presentation-runbook
