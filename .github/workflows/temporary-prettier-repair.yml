name: Temporary PR Prettier Repair

on:
  push:
    branches:
      - feature/password-login-staging-20261017

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical password-auth branch
        uses: actions/checkout@v4
        with:
          ref: feature/password-login-staging-20261017
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply pinned Prettier formatting
        run: npx --no-install prettier --write .

      - name: Commit formatting changes back to canonical branch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply repository Prettier formatting to password auth changes"
          git push origin HEAD:feature/password-login-staging-20261017
