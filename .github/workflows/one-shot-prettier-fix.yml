name: One-shot Prettier Fix

on:
  push:
    branches: [client/autonomous-dev-monitor-20261025]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Format the flagged files
        run: |
          npx prettier --write \
            docs/EXECUTION-PLAN-2026-10-21.md \
            docs/HANDOFF.md \
            docs/STAGING-RELEASE-AUDIT.md \
            scripts/autonomous-dev-monitor.js \
            test/test-autonomous-dev-monitor.js
      - name: Commit formatting-only delta to this feature branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Prettier made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/EXECUTION-PLAN-2026-10-21.md \
            docs/HANDOFF.md \
            docs/STAGING-RELEASE-AUDIT.md \
            scripts/autonomous-dev-monitor.js \
            test/test-autonomous-dev-monitor.js
          git commit -m "style: apply repository Prettier formatting"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:client/autonomous-dev-monitor-20261025
