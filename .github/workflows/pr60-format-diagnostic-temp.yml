name: Temporary PR 60 Formatting Diagnostic

on:
  push:
    branches:
      - feature/pr60-cross-functional-retrospective

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/feature/pr60-cross-functional-retrospective'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr60-cross-functional-retrospective
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          for file in docs/pr-handoffs/PR-60.md docs/PRODUCT-AND-ENGINEERING-RETROSPECTIVE.md; do
            echo "=== $file ==="
            npx prettier "$file" | diff -u "$file" - || true
          done
