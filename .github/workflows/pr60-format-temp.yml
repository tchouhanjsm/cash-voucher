name: Temporary PR 60 Markdown Formatting

on:
  push:
    branches:
      - feature/pr60-cross-functional-retrospective

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/pr60-cross-functional-retrospective'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr60-cross-functional-retrospective
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format retrospective documents
        run: npx prettier --write docs/pr-handoffs/PR-60.md docs/PRODUCT-AND-ENGINEERING-RETROSPECTIVE.md
      - name: Commit formatting only
        run: |
          if git diff --quiet -- docs/pr-handoffs/PR-60.md docs/PRODUCT-AND-ENGINEERING-RETROSPECTIVE.md; then
            echo "Documents already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pr-handoffs/PR-60.md docs/PRODUCT-AND-ENGINEERING-RETROSPECTIVE.md
          git commit -m "docs: apply Prettier formatting to PR 60 review"
          git push origin HEAD:feature/pr60-cross-functional-retrospective
