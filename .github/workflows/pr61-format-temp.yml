name: Temporary PR 61 Markdown Formatting

on:
  push:
    branches:
      - feature/accountant-recordkeeping-blueprint

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/accountant-recordkeeping-blueprint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/accountant-recordkeeping-blueprint
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format PR 61 documents
        run: npx prettier --write docs/ACCOUNTANT-RECORDKEEPING-AND-REPORTING-REQUIREMENTS.md docs/pr-handoffs/PR-61.md
      - name: Commit formatting only
        run: |
          if git diff --quiet -- docs/ACCOUNTANT-RECORDKEEPING-AND-REPORTING-REQUIREMENTS.md docs/pr-handoffs/PR-61.md; then
            echo "Documents already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACCOUNTANT-RECORDKEEPING-AND-REPORTING-REQUIREMENTS.md docs/pr-handoffs/PR-61.md
          git commit -m "docs: format accountant requirements"
          git push origin HEAD:feature/accountant-recordkeeping-blueprint
