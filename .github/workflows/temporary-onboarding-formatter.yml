name: Temporary onboarding formatter

on:
  push:
    branches:
      - feature/server-backed-client-onboarding-20261018

permissions:
  contents: write

jobs:
  format-onboarding:
    if: github.ref == 'refs/heads/feature/server-backed-client-onboarding-20261018'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format onboarding source
        run: npx prettier --write backend/85-onboarding.gs frontend/features/onboarding.js
      - name: Commit formatter output
        run: |
          if git diff --quiet -- backend/85-onboarding.gs frontend/features/onboarding.js; then
            echo "Onboarding files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/85-onboarding.gs frontend/features/onboarding.js
          git commit -m "style: format onboarding source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
