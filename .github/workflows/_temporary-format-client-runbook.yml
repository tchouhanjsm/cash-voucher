name: Temporary client runbook formatter

on:
  push:
    branches:
      - feature/client-launch-runbook-owner-model
    paths:
      - docs/CLIENT-ONBOARDING-PRESENTATION.html
      - .github/workflows/_temporary-format-client-runbook.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runbook branch
        uses: actions/checkout@v7
        with:
          ref: feature/client-launch-runbook-owner-model
          persist-credentials: true
      - name: Set up supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked formatter
        run: npm ci
      - name: Format client runbook
        run: npx prettier --write docs/CLIENT-ONBOARDING-PRESENTATION.html
      - name: Commit formatting correction if needed
        run: |
          if git diff --quiet -- docs/CLIENT-ONBOARDING-PRESENTATION.html; then
            echo "Client runbook is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLIENT-ONBOARDING-PRESENTATION.html
          git commit -m "Format client launch runbook"
          git push origin HEAD:feature/client-launch-runbook-owner-model
