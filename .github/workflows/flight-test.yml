name: Full Flight Test

on:
  push:
    branches: [client-main, 'client/**']
  pull_request:
    branches: [client-main]
  # Manual dispatch retains a deliberate full, chained run of CI, browser E2E and dependency audit.
  workflow_dispatch:

concurrency:
  group: flight-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # CI and Browser E2E perform the substantive checks. This third status is a release gate
  # that waits for both current-SHA results; it does not report success unless both actually pass.
  flight:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'client-main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify CI and Browser E2E on the same commit
        uses: actions/github-script@v7
        with:
          script: |
            const isPullRequest = context.eventName === 'pull_request';
            const sha = isPullRequest ? context.payload.pull_request.head.sha : context.sha;
            const branch = isPullRequest
              ? context.payload.pull_request.head.ref
              : context.ref.replace(/^refs\/heads\//, '');
            const event = context.eventName;
            const { owner, repo } = context.repo;
            const workflows = [
              { name: 'CI', workflow_id: 'ci.yml' },
              { name: 'Browser E2E', workflow_id: 'e2e.yml' },
            ];
            const deadline = Date.now() + 12 * 60 * 1000;
            const latest = {};

            core.info(`Waiting for CI and Browser E2E on ${sha} (branch=${branch}, event=${event}).`);

            while (Date.now() < deadline) {
              let allCompleted = true;

              for (const workflow of workflows) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.workflow_id,
                  head_sha: sha,
                  event,
                  per_page: 100,
                });

                const runs = response.data.workflow_runs
                  .filter((run) =>
                    run.head_sha === sha &&
                    run.head_branch === branch &&
                    run.event === event
                  )
                  .sort((a, b) => b.run_number - a.run_number);

                const run = runs[0];
                if (!run) {
                  latest[workflow.name] = 'not yet created for this commit';
                  allCompleted = false;
                  continue;
                }

                latest[workflow.name] = {
                  run: run.run_number,
                  status: run.status,
                  conclusion: run.conclusion || null,
                  sha: run.head_sha,
                };

                if (run.status !== 'completed') allCompleted = false;
              }

              if (allCompleted) {
                const failures = workflows.filter(
                  (workflow) => latest[workflow.name].conclusion !== 'success'
                );

                if (failures.length) {
                  core.setFailed(
                    `Full Flight gate failed for ${sha}. Required results: ${JSON.stringify(latest)}`
                  );
                  return;
                }

                core.info(
                  `Full Flight gate passed for ${sha}: CI and Browser E2E both completed successfully. Results: ${JSON.stringify(latest)}`
                );
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            core.setFailed(
              `Full Flight gate timed out waiting for current-SHA CI/E2E results. Latest observed state: ${JSON.stringify(latest)}`
            );

  manual-full-flight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete chained test suite
        run: npm run test:flight

      - name: Upload responsive visual review matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-manual-flight-visual-matrix
          path: /tmp/cash-voucher-visual-matrix/
          if-no-files-found: ignore

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-manual-flight-diagnostics
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
            /tmp/cash-voucher-e2e-server.log
          if-no-files-found: ignore
