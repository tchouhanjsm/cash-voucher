name: Optional Full Flight Test

on:
  workflow_dispatch:

concurrency:
  group: full-flight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete chained test suite
        run: npm run test:flight

      - name: Upload responsive visual review matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-manual-flight-visual-matrix
          path: /tmp/cash-voucher-visual-matrix/
          if-no-files-found: ignore

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-manual-flight-diagnostics
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
            /tmp/cash-voucher-e2e-server.log
          if-no-files-found: ignore
