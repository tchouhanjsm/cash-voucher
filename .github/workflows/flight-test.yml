name: Full Flight Test
on:
  # CI and Browser E2E execute the complete automated suite on each source revision.
  # Gate the third required check on both same-SHA results instead of repeating both suites,
  # which multiplies hosted-runner minutes without adding unique test coverage.
  workflow_run:
    workflows: ["Browser E2E"]
    types: [completed]
  # Keep the original chained full-suite test available for deliberate, manual release validation.
  workflow_dispatch:

concurrency:
  group: flight-gate-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  flight:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify successful Browser E2E and matching CI for the same commit
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const sha = upstream.head_sha;
            const branch = upstream.head_branch;
            const event = upstream.event;

            core.info(`Full Flight gate evaluating commit ${sha} (branch=${branch}, event=${event}).`);

            if (upstream.conclusion !== 'success') {
              core.setFailed(`Browser E2E for ${sha} concluded ${upstream.conclusion}; the flight gate cannot pass.`);
              return;
            }

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              event,
              per_page: 100,
            });

            const matchingRuns = response.data.workflow_runs
              .filter((run) =>
                run.head_sha === sha &&
                run.head_branch === branch &&
                run.event === event
              )
              .sort((a, b) => b.run_number - a.run_number);

            if (!matchingRuns.length) {
              core.setFailed(`No CI run exists for the same commit ${sha}, branch ${branch}, and event ${event}.`);
              return;
            }

            const ciRun = matchingRuns[0];
            core.info(`Matching CI run #${ciRun.run_number}: status=${ciRun.status}, conclusion=${ciRun.conclusion || 'pending'}.`);

            if (ciRun.status !== 'completed') {
              core.setFailed(`Matching CI run #${ciRun.run_number} is ${ciRun.status}; rerun the gate after CI completes.`);
              return;
            }

            if (ciRun.conclusion !== 'success') {
              core.setFailed(`Matching CI run #${ciRun.run_number} concluded ${ciRun.conclusion}; the flight gate cannot pass.`);
              return;
            }

            core.info(`Full Flight gate passed: CI run #${ciRun.run_number} and Browser E2E run #${upstream.run_number} both passed for ${sha}.`);

  manual-full-flight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete chained test suite
        run: npm run test:flight

      - name: Upload responsive visual review matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-manual-flight-visual-matrix
          path: /tmp/cash-voucher-visual-matrix/
          if-no-files-found: ignore

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-manual-flight-diagnostics
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
            /tmp/cash-voucher-e2e-server.log
          if-no-files-found: ignore
