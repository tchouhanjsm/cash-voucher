name: Temporary Format Helper
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format reviewed files and commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            backend/00-config.gs
            backend/15-migrations.gs
            backend/25-helpers.gs
            backend/50-vouchers.gs
            backend/60-vendors.gs
            backend/50-vouchers.gs
            docs/FAST-STAFF-PAYMENT-ENTRY.md
            frontend/features/administration.js
            frontend/features/payments.js
            frontend/features/printing.js
            style.css
            test/test-design-system.js
            test/test-backend.js
          )
          npx prettier --write "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then echo 'No formatting changes required'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'style: format fast staff payment entry tests'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
