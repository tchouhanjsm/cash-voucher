name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Capture seeded mock performance baseline
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Capture formatted Phase 21 files for local reconciliation
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/phase21-prettier"
          npx prettier --write docs/HANDOFF.md frontend-ui-kit.css style.css test/test-design-system.js
          cp docs/HANDOFF.md frontend-ui-kit.css style.css test/test-design-system.js "$RUNNER_TEMP/phase21-prettier/"
          cd "$RUNNER_TEMP/phase21-prettier"
          zip -q "$RUNNER_TEMP/phase21-prettier-output.zip" ./*
      - name: Upload formatted Phase 21 files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase21-prettier-output-${{ github.run_id }}
          path: ${{ runner.temp }}/phase21-prettier-output.zip
          if-no-files-found: error
      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
