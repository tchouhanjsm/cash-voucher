name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Capture seeded mock performance baseline
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Format staging candidate files for CI diagnosis
        run: |
          npx prettier --write \
            .github/workflows/staging-uat.yml \
            backend/80-settings-audit.gs \
            docs/APPS-SCRIPT-RELEASE-RUNBOOK.md \
            docs/HANDOFF.md \
            scripts/deploy-staging.js \
            scripts/staging-preflight.js \
            scripts/staging-web-server.js \
            test/mock-gas.js \
            test/test-deployment-readiness.js \
            test/test-staging-pipeline.js \
            test/test-staging-web-server.js \
            test/test-staging-workflow.js
          mkdir -p "${RUNNER_TEMP}/staging-prettier-output"
          cp --parents \
            .github/workflows/staging-uat.yml \
            backend/80-settings-audit.gs \
            docs/APPS-SCRIPT-RELEASE-RUNBOOK.md \
            docs/HANDOFF.md \
            scripts/deploy-staging.js \
            scripts/staging-preflight.js \
            scripts/staging-web-server.js \
            test/mock-gas.js \
            test/test-deployment-readiness.js \
            test/test-staging-pipeline.js \
            test/test-staging-web-server.js \
            test/test-staging-workflow.js \
            "${RUNNER_TEMP}/staging-prettier-output"

      - name: Upload formatted staging candidate files for remediation
        uses: actions/upload-artifact@v7
        with:
          name: staging-prettier-output-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-prettier-output/
          if-no-files-found: error

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
