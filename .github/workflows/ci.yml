name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Capture seeded mock performance baseline
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Temporary Prettier output for presentation normalization
        run: |
          node -e 'const fs = require("node:fs"); const prettier = require("prettier"); (async () => { const file = "docs/CLIENT-ONBOARDING-PRESENTATION.html"; const formatted = await prettier.format(fs.readFileSync(file, "utf8"), { filepath: file }); const encoded = Buffer.from(formatted, "utf8").toString("base64"); console.log("PRETTIER_FORMATTED_BEGIN"); for (let offset = 0; offset < encoded.length; offset += 3000) console.log("PRETTIER_CHUNK:" + encoded.slice(offset, offset + 3000)); console.log("PRETTIER_FORMATTED_END"); })().catch((error) => { console.error(error); process.exitCode = 1; });'

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
