name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary format diagnostics
        run: |
          files="docs/UI-SHELL-AND-DESIGN-SYSTEM.md index.html manifest.webmanifest scripts/check-contrast.js style.css"
          npx prettier --write $files
          for file in $files; do
            printf 'FORMAT_BASE64:%s:' "$file"
            base64 -w0 "$file"
            printf '\n'
          done

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
