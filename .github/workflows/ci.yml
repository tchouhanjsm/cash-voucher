name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format frontend queue files for diagnostics
        run: |
          npx prettier --write frontend/core/offline-queue.js frontend/features/payments.js
          git diff -- frontend/core/offline-queue.js frontend/features/payments.js

      - name: Run quality gate
        run: npm run check
