name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary one-off formatting aid for PR #111 only; remove before final review.
      - name: Format Daily Cash Close PR branch once
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 111 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "refs/heads/\${GH_HEAD_REF}:refs/remotes/origin/\${GH_HEAD_REF}"
          git checkout -B "\${GH_HEAD_REF}" "origin/\${GH_HEAD_REF}"
          npm run fix:format
          npm run fix:lint
          git add -u
          if git diff --cached --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Daily Cash Close implementation"
          git push origin "HEAD:refs/heads/\${GH_HEAD_REF}"

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
