name: CI

on:
  push:
    branches: [client-main, 'client/**']
  pull_request:
    branches: [client-main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary canonical formatting capture (remove after normalization)
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/DELIVERY-PHASE-2026-10-26-BULK.md frontend/features/dashboard.js test/test-staging-workflow.js
          for file in docs/DELIVERY-PHASE-2026-10-26-BULK.md frontend/features/dashboard.js test/test-staging-workflow.js; do
            printf 'BEGIN_B64:%s\n' "$file"
            base64 -w0 "$file" | fold -w 3000
            printf '\nEND_B64:%s\n' "$file"
          done
      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Capture seeded mock performance baseline
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality

      # Run the external registry security query last so a temporary npm audit outage
      # cannot prevent lint, formatting, unit tests, and PR handoff validation from running.
      # The job still fails closed if dependency audit does not pass.
      - name: Enforce dependency advisory policy
        run: npm run audit:deps
