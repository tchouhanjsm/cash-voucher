name: CI

on:
  push:
    branches: [client-main, 'client/**']
  pull_request:
    branches: [client-main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cash-voucher-ci-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: cash_voucher_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=cash-voucher-ci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CV_APP_ENV: test
      CV_DB_HOST: 127.0.0.1
      CV_DB_PORT: '3306'
      CV_DB_NAME: cash_voucher_test
      CV_DB_USER: cash_voucher_app
      CV_DB_PASSWORD: cash-voucher-test-app-password
      CV_MIGRATION_DB_USER: root
      CV_MIGRATION_DB_PASSWORD: cash-voucher-ci-root-only
      CV_ALLOW_SCHEMA_MIGRATIONS: 'true'
      CV_AUTH_RATE_LIMIT_KEY: cash-voucher-ci-rate-limit-key-32chars-minimum
      CV_LEGACY_PASSWORD_PEPPER: cash-voucher-ci-legacy-password-pepper
      CV_ALLOW_LEGACY_SHORT_PASSWORDS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run audit:secrets

      - name: Capture seeded mock performance baseline
        id: performance
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.performance.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Lint source
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        id: format
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Print non-mutating Prettier diff for changed files
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.format.outcome == 'failure' }}
        run: node scripts/show-format-diff.js

      - name: Validate JSON
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run validate:json

      - name: Check JavaScript syntax
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run check:syntax

      - name: Check backend layout
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run check:backend

      - name: Check contrast
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run check:contrast

      - name: Check frontend release safety
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run check:frontend

      - name: Check DOM sinks
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run check:dom-sinks

      - name: Check DOM sink sources
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run check:dom-sink-source

      - name: Run unit and regression tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm test

      - name: Validate PR handoff evidence
        if: ${{ always() && github.event_name == 'pull_request' && steps.dependencies.outcome == 'success' }}
        run: npm run check:pr-quality

      - name: Setup PHP runtime
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Lint isolated PHP API and migration sources
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run api:lint

      - name: Apply isolated test database migrations
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: php bin/migrate.php --apply

      - name: Verify production migration guard
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: |
          set +e
          CV_APP_ENV=production CV_ALLOW_SCHEMA_MIGRATIONS=true php bin/migrate.php --apply
          status=$?
          set -e
          test "$status" -eq 3
          set +e
          CV_APP_ENV=prod CV_ALLOW_SCHEMA_MIGRATIONS=true php bin/migrate.php --apply
          status=$?
          set -e
          test "$status" -eq 3

      - name: Configure restricted test-only runtime database account
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: php tests/php/prepare-test-db.php

      - name: Run PHP API and MySQL integration tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: php tests/php/run.php

      # Keep the external advisory query last, but run it even when a source/test gate fails.
      # The job remains failed if any required check or dependency audit does not pass.
      - name: Enforce dependency advisory policy
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run audit:deps
