name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare formatted dependency audit helper (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-maintenance'
        run: npx prettier scripts/dependency-audit.js > /tmp/dependency-audit.js

      - name: Upload formatter output (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-maintenance'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-dependency-audit
          path: /tmp/dependency-audit.js

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Run quality gate
        run: npm run check

      - name: Enforce PR batch size and handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
