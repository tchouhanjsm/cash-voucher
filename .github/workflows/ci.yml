name: CI

on:
  push:
    branches: ['client/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target-branch-policy:
    name: client-main PR target policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require client-main as the pull request target
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE_REF" != "client-main" ]; then
            echo "Pull requests must target client-main, not $BASE_REF."
            exit 1
          fi
          echo "Pull request target verified: client-main."

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Capture seeded mock performance baseline
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
