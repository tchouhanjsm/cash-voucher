name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: One-off Prettier diagnostics (temporary)
        run: |
          npx prettier --write docs/ACTIVE-DOM-SINK-INVENTORY.md docs/PHASE-4-AUTHORIZATION-RENDERING.md docs/SECURITY-RENDERING-AUDIT.md test/test-authorization-matrix.js
          git --no-pager diff --no-color -- docs/ACTIVE-DOM-SINK-INVENTORY.md docs/PHASE-4-AUTHORIZATION-RENDERING.md docs/SECURITY-RENDERING-AUDIT.md test/test-authorization-matrix.js
          exit 1

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
