name: CI

on:
  push:
    branches: [client-main, 'client/**']
  pull_request:
    branches: [client-main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan current files and reachable Git history for credential patterns
        run: npm run audit:secrets

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Capture seeded mock performance baseline
        env:
          CV_PERFORMANCE_BASELINE_OUT: ${{ runner.temp }}/cash-voucher-performance-baseline.json
        run: npm run measure:performance-baseline

      - name: Upload seeded mock performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: cash-voucher-performance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cash-voucher-performance-baseline.json
          if-no-files-found: error

      - name: Temporary formatter capture for staging pipeline docs
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/EXECUTION-PLAN-2026-10-21.md docs/STAGING-RELEASE-AUDIT.md test/test-branch-policy.js
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of [
            'docs/EXECUTION-PLAN-2026-10-21.md',
            'docs/STAGING-RELEASE-AUDIT.md',
            'test/test-branch-policy.js',
          ]) {
            console.log('FORMATTED_BASE64_' + file + '=' + fs.readFileSync(file).toString('base64'));
          }
          NODE

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
