name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary Prettier diff diagnostics
        run: |
          npx prettier --write backend/Code.gs docs/ACCOUNTANT-RECORDKEEPING-AND-REPORTING-REQUIREMENTS.md docs/DAILY-CASH-CLOSE-DESIGN.md frontend/core/state.js frontend/features/register.js test/test-backend.js
          git --no-pager diff --unified=2 -- backend/Code.gs docs/ACCOUNTANT-RECORDKEEPING-AND-REPORTING-REQUIREMENTS.md docs/DAILY-CASH-CLOSE-DESIGN.md frontend/core/state.js frontend/features/register.js test/test-backend.js
      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
