name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Diagnose exact Prettier output for the active batch
        run: |
          for file in docs/HANDOFF.md frontend/features/register.js; do
            echo "::group::Prettier diff for $file"
            npx prettier "$file" > "/tmp/$(basename "$file").prettier"
            diff -u "$file" "/tmp/$(basename "$file").prettier" || true
            echo "::endgroup::"
          done

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
