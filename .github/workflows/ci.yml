name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Diagnose handoff Markdown formatting (temporary PR #76 aid)
        if: github.event.pull_request.number == 76
        run: |
          npx prettier docs/HANDOFF.md > /tmp/HANDOFF.prettier.md
          diff -u docs/HANDOFF.md /tmp/HANDOFF.prettier.md || true

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
