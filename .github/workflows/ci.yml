name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary Prettier diff diagnostics
        run: |
          for file in docs/PR-HANDOFFS.md test/test-backup-failure.js test/test-pr-quality.js; do
            echo "=== Prettier diff: $file ==="
            npx prettier "$file" | diff -u "$file" - || true
          done

      - name: Enforce dependency advisory policy
        run: npm run audit:deps

      - name: Run quality gate
        run: npm run check

      - name: Validate PR handoff evidence
        if: github.event_name == 'pull_request'
        run: npm run check:pr-quality
